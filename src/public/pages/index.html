<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">    
    <title>Meus livros</title>
</head>
<body>
    <section>
        <header>
            <nav class="navbar">
               <div class="navbar__logo">MinhaBiblioteca</div>

                <button class="navbar__toggle" id="btnMenu" aria-label="Abrir menu">
                    <i class="bi bi-list"></i>
                </button>

                <ul class="navbar__links" id="menuLinks">
                    <li>
                        <a href="/pages/inicio.html"><i class="bi bi-house"></i> Início</a>
                    </li>
                    <li>
                        <a href="../pages/introducao.html"><i class="bi bi-people"></i>Quem somos nós?</a>
                    </li>
                    <li>
                        <a href="../pages/cadastro.html"><i class="bi bi-person-plus"></i> Cadastra-se</a>
                    </li>
                    <li>
                        <a href="../pages/contato.html">Entre contato conosco</a>
                    </li>

                    <!-- <li>
                        <form action="/logout" method="post">
                            <button type="submit"><i class="bi bi-box-arrow-right"></i> Sair</button>
                        </form>
                    </li> -->
                </ul>
            </nav>
        </header>
    </section>

    <section>
        <main>
            <h1>Bem-vindo(a) ao sistema "MinhaBiblioteca"!</h1>
            <div class = "container">
                <form action="/livros" method="post">
                    <label>Título: </label>
                    <input type="text" name="titulo" required>

                    <label>Autor: </label>
                    <input type="text" name="autor" required>

                    <label>Gênero: </label>
                    <input type="text" name="genero">

                    <label>Ano de publicação:</label>
                    <input type="number" name="anoDePublicacao">

                    <label>ISBN: </label>
                    <input type="text" name="isbn" >

                    <button type="submit">Adicionar livros</button>
                </form>
            </div>
        </main>
    </section>
    
    <form action="/logout" method="post">
        <button type="submit">Sair</button>
    </form>
</body>
</html>
